name: QA Portfolio Continuous Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e-tests:
    name: Run Playwright Tests (Monorepo)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm' # Habilita o cache automático do ~/.npm com base no package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-
          
    - name: Install Playwright Browsers (if not cached)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      # Focamos no chromium para poupar tempo de CI, alinhado com a config local
      run: npx playwright install --with-deps chromium
      
    - name: Install Playwright OS Dependencies (always required)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Se o cache do binário existir, precisamos apenas instalar as dependências de OS do runner
      run: npx playwright install-deps chromium
      
    - name: Run E2E Tests (Monorepo)
      env:
        POSTMAN_SID: ${{ secrets.POSTMAN_SID }} # Segurança: Injetado via GitHub Secrets
      # Roda a partir da raiz do monorepo, englobando todos os clientes
      run: npx playwright test
      
    - name: Upload Playwright Report as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  deploy-report:
    name: Deploy Report to GitHub Pages
    needs: e2e-tests
    if: always() # É crucial rodar mesmo se os testes falharem (para vermos os vídeos de erro no dashboard)
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Download Playwright Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
